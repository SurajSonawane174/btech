# ============================================================
# Engineering Comment Extraction & Classification Platform
# AI Engine Configuration
# ============================================================

# ---- OCR Settings ----
ocr:
  enabled: true               # Set to false to skip scanned pages entirely
  dpi: 300                    # Render DPI for OCR. Higher = better quality but slower.
                              #   - 300: Standard engineering drawings
                              #   - 400: Fine print or degraded scans
                              #   - 600: High-detail drawings (slow, high memory)
  language: "eng"             # Tesseract language code.
                              #   - "eng" for English
                              #   - "eng+fra" for English + French
  psm: 6                      # Tesseract Page Segmentation Mode
                              #   - 6: Assume uniform block of text (default for engineering)
                              #   - 3: Fully automatic (use for irregular notes)
                              #   - 11: Sparse text, no OSD
  confidence_threshold: 50   # Minimum word confidence % to include (0–100)
                              #   Lower = more text captured but noisier results

# ---- Screenshot Settings ----
screenshot:
  margin: 1.15                # Expansion factor around annotation bounding box
                              #   - 1.15 = 15% padding on each side (spec default)
                              #   - 1.50 = 50% padding for more context
  min_width: 200              # Minimum screenshot width in pixels
  min_height: 150             # Minimum screenshot height in pixels

# ---- Classification Settings ----
classification:
  similarity_threshold: 90   # RapidFuzz ratio threshold for "repeated" detection (0–100)
                              #   - 90: Strict (only near-identical comments flagged)
                              #   - 80: Relaxed (more comments flagged as repeated)
  gemini_model: "gemini-2.0-flash-lite"    # Gemini model to use
                                     # Options:
                                     #   - gemini-2.0-flash      (fast, cost-effective — recommended)
                                     #   - gemini-2.0-flash-lite (cheapest)
                                     #   - gemini-1.5-pro        (highest accuracy, older)

# ---- Unique ID Settings ----
uid:
  row_density: 80             # Grid rows per page for UID row calculation (60–100)
                              #   Higher = finer position granularity

# ---- Page Type Detection ----
scanned_text_threshold: 50   # Characters threshold: pages with fewer chars are treated
                              # as SCANNED and sent through OCR
                              # Increase if vector pages are wrongly classified as scanned
